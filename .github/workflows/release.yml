name: Secure Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify tag belongs to main and matches app version
        shell: bash
        run: |
          git fetch origin main develop --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          test -n "$VERSION"
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Restore protected signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          LEGACY_SIGNING_KEY_BASE64: ${{ secrets.LEGACY_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$LEGACY_SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/yuedu-release.jks"
          printf '%s' "$LEGACY_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/yuedu-legacy.jks"
          chmod 600 "$RUNNER_TEMP/yuedu-release.jks"
          chmod 600 "$RUNNER_TEMP/yuedu-legacy.jks"

      - name: Build obfuscated unsigned APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease :app:lintRelease

      - name: Sign with protected rotation lineage
        shell: bash
        env:
          YUEDU_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YUEDU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/yuedu-aligned.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/yuedu-legacy.jks" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer \
            --ks "$RUNNER_TEMP/yuedu-release.jks" --ks-type PKCS12 --ks-key-alias yuedu-release --ks-pass env:YUEDU_STORE_PASSWORD --key-pass env:YUEDU_KEY_PASSWORD \
            --lineage signing/yuedu-lineage.bin --rotation-min-sdk-version 28 \
            --out "YueDu-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/yuedu-aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "YueDu-${GITHUB_REF_NAME}.apk"
          sha256sum "YueDu-${GITHUB_REF_NAME}.apk" > "YueDu-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "YueDu-${GITHUB_REF_NAME}.apk" "YueDu-${GITHUB_REF_NAME}.apk.sha256" --verify-tag --generate-notes

      - name: Synchronize released main back to develop
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B develop origin/develop
          git merge --no-edit "$GITHUB_SHA"
          git push origin develop

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yuedu-release.jks" "$RUNNER_TEMP/yuedu-legacy.jks" "$RUNNER_TEMP/yuedu-aligned.apk"
