name: Branch Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile, lint and test branch
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

      - name: Verify obfuscated release candidate
        if: startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/main'
        shell: bash
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
